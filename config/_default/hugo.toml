# RailTech — Hugo base configuration (Blowfish theme)
# Language-specific settings → languages.*.toml
# Menu definitions     → menus.*.toml
# Theme parameters     → params.toml

baseURL = "http://localhost:1313/"
title = "RailTech"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = false
summarylength = 70
timeout = "60s"

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[imaging]
  quality = 85

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"
