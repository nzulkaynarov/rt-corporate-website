baseURL = "https://railtech.uz/"
languageCode = "ru"
title = "RailTech"
theme = "blowfish"

defaultContentLanguage = "ru"
enableRobotsTXT = true
summaryLength = 100

[pagination]
pagerSize = 9

[markup.highlight]
style = "dracula"

[markup.goldmark.renderer]
unsafe = true

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
# Sitemap and robots.txt are auto-generated (enableRobotsTXT = true above)

[params]
colorScheme = "railtech"
defaultAppearance = "dark"
autoSwitchAppearance = false
enableSearch = true
enableCodeCopy = true

# Default images (fallbacks for pages without featured images)
defaultBackgroundImage = "img/hero/default-featured.jpg"
defaultFeaturedImage = "img/hero/default-featured.jpg"

# Images
logo = "img/brand/railtech-logo.svg"
favicon = "img/brand/favicon.svg"

# Author = Company branding (used by hero layout)
[params.author]
name = "RailTech"
image = "img/brand/railtech-logo.svg"
headline = "Комплексные поставки промышленного оборудования в Узбекистане"
  [[params.author.links]]
    telegram = "https://t.me/railtech_uz"
  [[params.author.links]]
    linkedin = "https://linkedin.com/company/railtech-uz"
  [[params.author.links]]
    email = "info@railtech.uz"

# Homepage
[params.homepage]
layout = "hero"
homepageImage = "img/hero/railway-main.jpg"
showRecent = true
showRecentItems = 6
showMoreLink = true
showMoreLinkDest = "/blog"
cardView = true
cardViewScreenWidth = true

# Article (blog posts)
[params.article]
showHero = true
heroStyle = "background"
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = true
showDate = true
showDateUpdated = false
showAuthor = true
showBreadcrumbs = true
showTableOfContents = true
showRelatedContent = true
relatedContentLimit = 3
sharingLinks = ["telegram", "facebook", "linkedin"]

# List pages
[params.list]
showHero = true
heroStyle = "background"
layoutBackgroundBlur = true
layoutBackgroundHeaderSpace = true
showBreadcrumbs = true
showSummary = true
showTableOfContents = false
groupByYear = false
cardView = true
cardViewScreenWidth = false

# Taxonomy
[params.taxonomy]
showTermCount = true
cardView = true

# Header — fixed with blur for modern sticky navigation
[params.header]
layout = "fixed-fill-blur"

# Footer
[params.footer]
showCopyright = false
showThemeAttribution = false
showAppearanceSwitcher = true
showScrollToTop = true

# RailTech custom params
[params.extra]
phone = "+998 90 118-90-00"
email = "info@railtech.uz"
catalogURL = "https://b2b.railtech.uz"
cabinetURL = "https://cabinet.railtech.uz"
mapLat = "41.2995"
mapLon = "69.2401"
web3formsKey = "WEB3FORMS_ACCESS_KEY"
copyright = "© 2021–2026 RailTech LLC"

# SEO Configuration
# Extended SEO settings (verification, robots rules, sitemap) → data/seo.yaml
# Blowfish-native SEO params below:
[params.seo]
defaultOgImage = "img/og-default.png"
siteAuthor = "RailTech LLC"
twitterHandle = "@railtech"

# Languages
[languages.ru]
languageName = "Русский"
weight = 1
contentDir = "content/ru"
[languages.ru.params.author]
headline = "Комплексные поставки промышленного оборудования в Узбекистане"

[languages.en]
languageName = "English"
weight = 2
contentDir = "content/en"
[languages.en.params.author]
headline = "Comprehensive Industrial Equipment Supply in Uzbekistan"

[languages.uz]
languageName = "Oʻzbekcha"
weight = 3
contentDir = "content/uz"
[languages.uz.params.author]
headline = "O'zbekistonda sanoat uskunalarini yetkazib berish"

