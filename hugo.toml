baseURL = 'https://nzulkaynarov.github.io/rt-website-public/'
# Overridden in CI/CD via --baseURL flag. Set SITE_URL repo variable to use custom domain.
title = 'RailTech'
enableRobotsTXT = true
enableGitInfo = false
summarylength = 70
timeout = "60s"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 9

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = true

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[imaging]
  quality = 85
  resampleFilter = "Lanczos"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false
    [minify.tdewolff.css]
      keepCSS2 = true

