# Sveltia CMS schema for railtech.uz — must match src/content/config.ts and src/data/cms/*.json
# (checked by scripts/validate-cms-config.mjs). See docs/ARCHITECTURE.md §3.
# [RU] fields are required; [UZ]/[EN] may stay empty during the RU-first stage (the site shows RU).
backend:
  name: github
  repo: nzulkaynarov/rt-corporate-website
  branch: main
media_folder: public/images/uploads
public_folder: /images/uploads
locale: ru
collections:
- name: services
  label: 1. Услуги
  label_singular: Услуга
  folder: src/content/services
  create: true
  slug: '{{slug}}'
  summary: '{{title}}'
  sortable_fields:
  - order
  - title
  fields:
  - label: Для кого
    name: audience
    widget: select
    options:
    - label: Заказчикам
      value: customers
    - label: Партнёрам
      value: partners
  - label: Порядок
    name: order
    widget: number
    value_type: int
    default: 1
  - label: Название [RU]
    name: title
    widget: string
  - label: Название [UZ]
    name: title_uz
    widget: string
    required: false
  - label: Название [EN]
    name: title_en
    widget: string
    required: false
  - label: Кратко (для карточек и поиска) [RU]
    name: summary
    widget: text
  - label: Кратко (для карточек и поиска) [UZ]
    name: summary_uz
    widget: text
    required: false
  - label: Кратко (для карточек и поиска) [EN]
    name: summary_en
    widget: text
    required: false
  - label: Вводный абзац [RU]
    name: lead
    widget: text
  - label: Вводный абзац [UZ]
    name: lead_uz
    widget: text
    required: false
  - label: Вводный абзац [EN]
    name: lead_en
    widget: text
    required: false
  - label: Коротко (метка → значение)
    name: highlights
    widget: list
    required: false
    fields:
    - label: Метка [RU]
      name: label
      widget: string
    - label: Метка [UZ]
      name: label_uz
      widget: string
      required: false
    - label: Метка [EN]
      name: label_en
      widget: string
      required: false
    - label: Значение [RU]
      name: value
      widget: string
    - label: Значение [UZ]
      name: value_uz
      widget: string
      required: false
    - label: Значение [EN]
      name: value_en
      widget: string
      required: false
  - label: Как работаем (по порядку)
    name: steps
    widget: list
    required: false
    fields: &id001
    - label: Заголовок [RU]
      name: title
      widget: string
    - label: Заголовок [UZ]
      name: title_uz
      widget: string
      required: false
    - label: Заголовок [EN]
      name: title_en
      widget: string
      required: false
    - label: Текст [RU]
      name: text
      widget: text
    - label: Текст [UZ]
      name: text_uz
      widget: text
      required: false
    - label: Текст [EN]
      name: text_en
      widget: text
      required: false
  - label: Что получает клиент или партнёр
    name: benefits
    widget: list
    required: false
    fields: *id001
  - label: Что нужно от партнёра (необязательно)
    name: requirements
    widget: list
    required: false
    fields: *id001
  - label: Частые вопросы
    name: faq
    widget: list
    required: false
    fields:
    - label: Вопрос [RU]
      name: q
      widget: string
    - label: Вопрос [UZ]
      name: q_uz
      widget: string
      required: false
    - label: Вопрос [EN]
      name: q_en
      widget: string
      required: false
    - label: Ответ [RU]
      name: a
      widget: text
    - label: Ответ [UZ]
      name: a_uz
      widget: text
      required: false
    - label: Ответ [EN]
      name: a_en
      widget: text
      required: false
  - &id002
    label: 'Текст [RU] (Markdown, подзаголовки ###)'
    name: body
    widget: markdown
    required: false
  - &id003
    label: Текст [UZ]
    name: body_uz
    widget: markdown
    required: false
  - &id004
    label: Текст [EN]
    name: body_en
    widget: markdown
    required: false
  - &id005
    label: 'SEO: заголовок (≤ 60 знаков, пусто = название) [RU]'
    name: seoTitle
    widget: string
    required: false
  - &id006
    label: 'SEO: заголовок (≤ 60 знаков, пусто = название) [UZ]'
    name: seoTitle_uz
    widget: string
    required: false
  - &id007
    label: 'SEO: заголовок (≤ 60 знаков, пусто = название) [EN]'
    name: seoTitle_en
    widget: string
    required: false
  - &id008
    label: 'SEO: описание (70–160 знаков, пусто = краткое описание) [RU]'
    name: seoDescription
    widget: text
    required: false
  - &id009
    label: 'SEO: описание (70–160 знаков, пусто = краткое описание) [UZ]'
    name: seoDescription_uz
    widget: text
    required: false
  - &id010
    label: 'SEO: описание (70–160 знаков, пусто = краткое описание) [EN]'
    name: seoDescription_en
    widget: text
    required: false
- name: news
  label: 2. Новости, статьи, проекты, партнёры
  label_singular: Материал
  folder: src/content/news
  create: true
  slug: '{{slug}}'
  summary: '{{date}} · {{title}}'
  sortable_fields:
  - date
  - title
  fields:
  - label: Тип
    name: type
    widget: select
    options:
    - label: Новость
      value: news
    - label: Статья
      value: article
    - label: Проект
      value: project
    - label: О партнёре
      value: partner
  - label: Дата
    name: date
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD.MM.YYYY
    time_format: false
  - label: Заголовок [RU]
    name: title
    widget: string
  - label: Заголовок [UZ]
    name: title_uz
    widget: string
    required: false
  - label: Заголовок [EN]
    name: title_en
    widget: string
    required: false
  - label: Кратко (70–300 знаков) [RU]
    name: summary
    widget: text
  - label: Кратко (70–300 знаков) [UZ]
    name: summary_uz
    widget: text
    required: false
  - label: Кратко (70–300 знаков) [EN]
    name: summary_en
    widget: text
    required: false
  - label: Обложка (своё фото или с разрешения)
    name: cover
    widget: image
    required: false
  - label: Описание обложки [RU]
    name: coverAlt
    widget: string
    required: false
  - label: Описание обложки [UZ]
    name: coverAlt_uz
    widget: string
    required: false
  - label: Описание обложки [EN]
    name: coverAlt_en
    widget: string
    required: false
  - label: Партнёры, о которых материал
    name: partners
    widget: relation
    required: false
    collection: site
    file: partners
    search_fields:
    - partners.*.name
    value_field: partners.*.id
    display_fields:
    - partners.*.name
    multiple: true
  - label: Закрепить
    name: featured
    widget: boolean
    required: false
    default: false
  - *id002
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
