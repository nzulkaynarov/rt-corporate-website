# Sveltia CMS schema for railtech.uz — must match src/content/config.ts and src/data/cms/*.json
# (checked by scripts/validate-cms-config.mjs, which also checks the data against pattern/minlength/maxlength).
# See docs/ARCHITECTURE.md §3. [RU] fields are required; [UZ]/[EN] follow the translation stage in
# src/data/content-stage.json (news stays Russian-only while listed in ruOnlySections).
backend:
  name: github
  repo: nzulkaynarov/rt-corporate-website
  branch: main
media_folder: public/images/uploads
public_folder: /images/uploads
collections:
  - name: services
    label: 1. Услуги
    label_singular: Услуга
    folder: src/content/services
    create: false
    slug: '{{slug}}'
    summary: '{{order}}. {{title}}'
    sortable_fields:
      fields:
        - order
        - title
      default:
        field: order
        direction: ascending
    fields:
      - label: Для кого
        name: audience
        widget: select
        options:
          - label: Заказчикам
            value: customers
          - label: Партнёрам
            value: partners
      - label: Порядок
        name: order
        widget: number
        value_type: int
        default: 1
      - label: Название
        name: title
        widget: string
        i18n: true
        required:
          - ru
      - label: Кратко (для карточек и поиска)
        name: summary
        widget: text
        maxlength: 300
        minlength: 70
        hint: '70–300 знаков: карточка услуги и описание для поиска.'
        i18n: true
        required:
          - ru
      - label: Вводный абзац
        name: lead
        widget: text
        i18n: true
        required:
          - ru
      - label: Коротко (метка → значение)
        name: highlights
        widget: list
        required: false
        fields:
          - label: Метка
            name: label
            widget: string
            i18n: true
            required:
              - ru
          - label: Значение
            name: value
            widget: string
            i18n: true
            required:
              - ru
        summary: '{{fields.value}} — {{fields.label}}'
        i18n: true
      - label: Как работаем (по порядку)
        name: steps
        widget: list
        required: false
        fields:
          - label: Заголовок
            name: title
            widget: string
            i18n: true
            required:
              - ru
          - label: Текст
            name: text
            widget: text
            i18n: true
            required:
              - ru
        summary: '{{fields.title}}'
        collapsed: true
        i18n: true
      - label: Что получает клиент или партнёр
        name: benefits
        widget: list
        required: false
        fields:
          - label: Заголовок
            name: title
            widget: string
            i18n: true
            required:
              - ru
          - label: Текст
            name: text
            widget: text
            i18n: true
            required:
              - ru
        summary: '{{fields.title}}'
        collapsed: true
        i18n: true
      - label: Что нужно от партнёра (необязательно)
        name: requirements
        widget: list
        required: false
        fields:
          - label: Заголовок
            name: title
            widget: string
            i18n: true
            required:
              - ru
          - label: Текст
            name: text
            widget: text
            i18n: true
            required:
              - ru
        summary: '{{fields.title}}'
        collapsed: true
        i18n: true
      - label: Частые вопросы
        name: faq
        widget: list
        required: false
        fields:
          - label: Вопрос
            name: q
            widget: string
            i18n: true
            required:
              - ru
          - label: Ответ
            name: a
            widget: text
            i18n: true
            required:
              - ru
        summary: '{{fields.q}}'
        collapsed: true
        i18n: true
      - label: 'Текст: подзаголовки ###, цитата, списки, таблица, фото с подписью, сноска текст[^1] + [^1]: пояснение'
        name: body
        widget: markdown
        required: false
        buttons: &ref_0
          - bold
          - italic
          - link
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
        editor_components: &ref_1
          - image
        i18n: true
      - label: 'SEO: заголовок (≤ 60 знаков, пусто = название)'
        name: seoTitle
        widget: string
        required: false
        maxlength: 60
        hint: До 60 знаков, без « | RailTech» — он добавляется сам. Пусто — берётся заголовок.
        i18n: true
      - label: 'SEO: описание (70–160 знаков, пусто = краткое описание)'
        name: seoDescription
        widget: text
        required: false
        maxlength: 160
        hint: 70–160 знаков. Пусто — берётся «Кратко».
        i18n: true
    delete: false
    description: 'Четыре услуги сайта. Новые услуги не создаются: структура задана в docs/ARCHITECTURE.md. Подстановки из «Компании»: `{phone}`, `{email}`, `{inn}`, `{site}`, `{cabinet}`, `{foundedYear}`, `{officeAddress}`, `{legalAddress}` — не пишите эти значения текстом.'
    i18n: true
  - name: news
    label: 2. Новости, статьи, проекты, партнёры
    label_singular: Материал
    folder: src/content/news
    create: true
    slug: '{{slug}}'
    summary: '{{date}} · {{title}}'
    sortable_fields:
      fields:
        - date
        - title
      default:
        field: date
        direction: descending
    fields:
      - label: Тип
        name: type
        widget: select
        options:
          - label: Новость
            value: news
          - label: Статья
            value: article
          - label: Проект
            value: project
          - label: О партнёре
            value: partner
        hint: «О партнёре» — статья, на которую ведёт плитка производителя.
      - label: Дата
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD.MM.YYYY
        time_format: false
        default: '{{now}}'
      - label: Заголовок
        name: title
        widget: string
        i18n: true
        required:
          - ru
      - label: Кратко (70–300 знаков)
        name: summary
        widget: text
        maxlength: 300
        minlength: 70
        hint: '70–300 знаков: подзаголовок, карточка и описание для поиска.'
        i18n: true
        required:
          - ru
      - label: Обложка (своё фото или с разрешения)
        name: cover
        widget: image
        required: false
      - label: Описание обложки
        name: coverAlt
        widget: string
        required: false
        hint: 'Что изображено на фото: для незрячих и поисковиков.'
        i18n: true
      - label: Галерея (фото под текстом, открываются на весь экран)
        name: gallery
        widget: list
        required: false
        summary: '{{fields.alt}}'
        fields:
          - label: Фото
            name: image
            widget: image
            i18n: duplicate
          - label: Описание фото
            name: alt
            widget: string
            required: false
            hint: 'Что изображено на фото: для незрячих и поисковиков.'
            i18n: true
        collapsed: true
        i18n: true
      - label: Партнёры, о которых материал
        name: partners
        widget: relation
        required: false
        collection: site
        file: partners
        search_fields:
          - partners.*.name
        value_field: partners.*.id
        display_fields:
          - partners.*.name
        multiple: true
        hint: Материал появится в блоке «Материалы о партнёре» на его странице.
      - label: Закрепить
        name: featured
        widget: boolean
        required: false
        default: false
        hint: Закреплённый материал идёт первым в блоке новостей на главной.
      - label: 'Текст: подзаголовки ###, цитата, списки, таблица, фото с подписью, сноска текст[^1] + [^1]: пояснение'
        name: body
        widget: markdown
        required: false
        buttons: *ref_0
        editor_components: *ref_1
        i18n: true
      - label: 'SEO: заголовок (≤ 60 знаков, пусто = название)'
        name: seoTitle
        widget: string
        required: false
        maxlength: 60
        hint: До 60 знаков, без « | RailTech» — он добавляется сам. Пусто — берётся заголовок.
        i18n: true
      - label: 'SEO: описание (70–160 знаков, пусто = краткое описание)'
        name: seoDescription
        widget: text
        required: false
        maxlength: 160
        hint: 70–160 знаков. Пусто — берётся «Кратко».
        i18n: true
    description: Новости, статьи, проекты и статьи о партнёрах. Адрес страницы задаётся при создании латиницей и потом не меняется.
    view_filters:
      - label: Новости
        field: type
        pattern: ^news$
      - label: Статьи
        field: type
        pattern: ^article$
      - label: Проекты
        field: type
        pattern: ^project$
      - label: О партнёрах
        field: type
        pattern: ^partner$
      - label: Без обложки
        field: cover
        empty: true
    view_groups:
      - label: Тип
        field: type
      - label: Год
        field: date
        pattern: \d{4}
    i18n:
      initial_locales: default
  - name: site
    label: 3. Тексты сайта и настройки
    editor:
      preview: false
    files:
      - name: company
        label: 'Компания: реквизиты, контакты, Кабинет, цифры'
        file: src/data/cms/company.json
        fields:
          - label: Бренд
            name: brandName
            widget: string
          - label: Логотип (знак, SVG или PNG — шапка, футер, первый экран, поисковики)
            name: logo
            widget: image
          - label: Заглушка фото (материал без обложки)
            name: logoPlaceholder
            widget: image
          - label: Домен сайта (подпись на картинке для соцсетей)
            name: siteDomain
            widget: string
            pattern:
              - ^[a-z0-9-]+(\.[a-z0-9-]+)+$
              - Домен без https:// и слэшей, например railtech.uz
          - label: Краткое наименование
            name: companyName
            widget: string
            i18n: true
            required:
              - ru
          - label: Полное наименование
            name: fullName
            widget: string
            i18n: true
            required:
              - ru
          - label: Год основания
            name: foundedYear
            widget: string
            pattern:
              - ^(19|20)\d{2}$
              - Год — четыре цифры
          - label: ИНН
            name: inn
            widget: string
            pattern:
              - ^\d{9}$
              - ИНН — 9 цифр
          - label: Город
            name: city
            widget: string
            i18n: true
            required:
              - ru
          - label: Код страны
            name: countryCode
            widget: string
            pattern:
              - ^[A-Z]{2}$
              - Код страны ISO из двух латинских букв, например UZ
          - label: Юридический адрес
            name: legalAddress
            widget: string
            i18n: true
            required:
              - ru
          - label: Адрес офиса
            name: officeAddress
            widget: string
            i18n: true
            required:
              - ru
          - label: Телефон
            name: phone
            widget: string
            pattern:
              - ^\+998 \d{2} \d{3}-\d{2}-\d{2}$
              - 'Формат: +998 90 118-90-00'
          - label: E-mail
            name: email
            widget: string
            type: email
          - label: Telegram-бот (имя без @)
            name: telegramBot
            widget: string
            hint: 'Ссылка на сайте: t.me/<имя>?start=web'
            pattern:
              - ^[A-Za-z][A-Za-z0-9_]{3,30}[Bb][Oo][Tt]$
              - Имя бота без @ и ссылки, оканчивается на bot
          - label: Банк
            name: bank
            widget: object
            fields:
              - label: Банк и филиал
                name: name
                widget: string
                i18n: true
                required:
                  - ru
              - label: МФО
                name: mfo
                widget: string
                pattern:
                  - ^\d{5}$
                  - МФО — 5 цифр
                i18n: duplicate
              - label: Расчётный счёт
                name: account
                widget: string
                pattern:
                  - ^\d{20}$
                  - Расчётный счёт — 20 цифр
                i18n: duplicate
            i18n: true
          - label: Кабинет
            name: cabinet
            widget: object
            fields:
              - label: Адрес Кабинета
                name: url
                widget: string
                type: url
                i18n: duplicate
                hint: Адрес Кабинета, например https://cabinet.railtech.uz. Ссылки входа (/login) и приглашения (/new-client) строятся от него.
          - label: Адрес приёма заявок (CRM)
            name: leadEndpoint
            widget: string
            hint: POST заявки и GET …/token; см. docs/ARCHITECTURE.md §5
            type: url
          - label: Цифры на главной
            name: metrics
            widget: list
            required: false
            fields:
              - label: Значение
                name: value
                widget: string
                i18n: duplicate
              - label: Подпись
                name: label
                widget: string
                i18n: true
                required:
                  - ru
            summary: '{{fields.value}} — {{fields.label}}'
            i18n: true
        i18n: true
      - name: home
        label: Главная
        file: src/data/cms/home.json
        fields:
          - label: Первый экран
            name: hero
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Подзаголовок
                name: lead
                widget: text
                i18n: true
                required:
                  - ru
              - label: Входы для аудиторий
                name: entries
                widget: list
                required: false
                fields:
                  - label: Заголовок
                    name: title
                    widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Текст
                    name: text
                    widget: text
                    i18n: true
                    required:
                      - ru
                  - label: Ссылка (маршрут, напр. /services/supply/)
                    name: link
                    widget: string
                    pattern:
                      - ^/([a-z0-9-]+/)*(#[a-z0-9-]+)?$
                      - Маршрут сайта без языка и домена, например /services/supply/
                    i18n: duplicate
                summary: '{{fields.title}}'
                i18n: true
            i18n: true
          - label: 'Мост: барьеры и решения'
            name: bridge
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Колонка «Заказчик»
                name: customerTitle
                widget: string
                i18n: true
                required:
                  - ru
              - label: Пояснение «Заказчик»
                name: customerNote
                widget: string
                i18n: true
                required:
                  - ru
              - label: Колонка RailTech
                name: railtechTitle
                widget: string
                i18n: true
                required:
                  - ru
              - label: Пояснение RailTech
                name: railtechNote
                widget: string
                i18n: true
                required:
                  - ru
              - label: Колонка «Партнёр»
                name: partnerTitle
                widget: string
                i18n: true
                required:
                  - ru
              - label: Пояснение «Партнёр»
                name: partnerNote
                widget: string
                i18n: true
                required:
                  - ru
              - label: Этапы
                name: rows
                widget: list
                required: false
                fields:
                  - label: Этап
                    name: stage
                    widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Заказчик теряет
                    name: customer
                    widget: text
                    i18n: true
                    required:
                      - ru
                  - label: RailTech берёт на себя
                    name: railtech
                    widget: text
                    i18n: true
                    required:
                      - ru
                  - label: Партнёр теряет
                    name: partner
                    widget: text
                    i18n: true
                    required:
                      - ru
                summary: '{{fields.stage}}'
                collapsed: true
                i18n: true
            i18n: true
          - label: Возможности
            name: directions
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
            i18n: true
          - label: О компании
            name: about
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Текст
                name: text
                widget: text
                i18n: true
                required:
                  - ru
              - label: Миссия
                name: mission
                widget: text
                i18n: true
                required:
                  - ru
            i18n: true
          - label: Производители
            name: partners
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Пояснение
                name: note
                widget: text
                i18n: true
                required:
                  - ru
            i18n: true
          - label: Кабинет
            name: cabinet
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Текст
                name: text
                widget: text
                i18n: true
                required:
                  - ru
              - label: Факты
                name: facts
                widget: list
                required: false
                fields:
                  - label: Значение
                    name: value
                    widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Подпись
                    name: label
                    widget: string
                    i18n: true
                    required:
                      - ru
                summary: '{{fields.value}} — {{fields.label}}'
                i18n: true
              - label: Иллюстрация сделки
                name: demo
                widget: object
                fields:
                  - label: Название
                    name: title
                    widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Пометка
                    name: note
                    widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Стадии
                    name: stages
                    widget: list
                    field:
                      label: Стадия
                      name: stage
                      widget: string
                    i18n: true
                    required:
                      - ru
                  - label: Текущая стадия (номер с 0)
                    name: current
                    widget: number
                    value_type: int
                    min: 0
                    hint: Номер текущей стадии, считая с 0 (0 — первая).
                    i18n: duplicate
                  - label: Строки
                    name: rows
                    widget: list
                    required: false
                    fields:
                      - label: Документ
                        name: label
                        widget: string
                        i18n: true
                        required:
                          - ru
                      - label: Статус
                        name: status
                        widget: string
                        i18n: true
                        required:
                          - ru
                      - label: Цвет статуса
                        name: tone
                        widget: select
                        options:
                          - ok
                          - wait
                          - neutral
                        i18n: duplicate
                    summary: '{{fields.label}}'
                    collapsed: true
                    i18n: true
                  - label: Подпись снизу
                    name: footnote
                    widget: string
                    i18n: true
                    required:
                      - ru
                i18n: true
            i18n: true
          - label: Новости
            name: news
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
            i18n: true
          - label: Приглашение и заявка
            name: invite
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Текст
                name: text
                widget: text
                i18n: true
                required:
                  - ru
            i18n: true
        i18n: true
      - name: pages
        label: 'Страницы: Услуги, Новости, Контакты, 404'
        file: src/data/cms/pages.json
        fields:
          - label: Услуги (обзор)
            name: services
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
              - label: Вводный абзац
                name: lead
                widget: text
                i18n: true
                required:
                  - ru
              - label: Группа «Заказчикам»
                name: customersTitle
                widget: string
                i18n: true
                required:
                  - ru
              - label: Описание группы
                name: customersText
                widget: text
                i18n: true
                required:
                  - ru
              - label: Группа «Партнёрам»
                name: partnersTitle
                widget: string
                i18n: true
                required:
                  - ru
              - label: Описание группы
                name: partnersText
                widget: text
                i18n: true
                required:
                  - ru
            i18n: true
          - label: Новости
            name: news
            widget: object
            fields:
              - label: Надзаголовок
                name: eyebrow
                widget: string
                i18n: true
                required:
                  - ru
              - label: Заголовок
                name: title
                widget: string
                i18n: true
                required:
                  - ru
