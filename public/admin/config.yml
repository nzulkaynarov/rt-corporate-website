backend:
  name: github
  repo: nzulkaynarov/rt-corporate-website
  branch: main

local_backend: true

auth_methods:
  - token
  - oauth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # --------------------------------------------------------------------------
  # 1. CATALOG COLLECTION
  # --------------------------------------------------------------------------
  - name: "catalog"
    label: "1. Каталог продукции (/catalog)"
    folder: "src/content/catalog"
    create: true
    slug: "{{sku}}"
    fields:
      # --- ОБЩИЕ ТЕХНИЧЕСКИЕ ДАННЫЕ (ЗАПОЛНЯЮТСЯ 1 РАЗ) ---
      - { label: "⚙️ Код SKU (Артикул)", name: "sku", widget: "string", hint: "Уникальный идентификатор позиции (напр. RT-RS-118)" }
      - { label: "⚙️ Категория изделия", name: "category", widget: "string", required: false, hint: "Любая категория (напр. Подвижной состав, Спецтехника, Инструмент)" }
      - { label: "⚙️ ГОСТ / Стандарт", name: "gost", widget: "string", required: false, hint: "ГОСТ или ТУ (напр. ГОСТ 9246-2013)" }
      - { label: "⚙️ Код ТН ВЭД (HS Code)", name: "tnved", widget: "string", required: false, hint: "Таможенный код ТН ВЭД РУз (напр. 8607 12 000 0)" }
      - { label: "⚙️ Цена (UZS)", name: "price", widget: "string", required: false, hint: "Фиксированная цена в сумах или оставьте пустым" }
      - { label: "⚙️ Базис склада", name: "warehouse", widget: "string", default: "Ташкент, Index B2-2097" }
      - { label: "⚙️ Базис склада (UZ)", name: "warehouse_uz", widget: "string", default: "Toshkent, Index B2-2097", required: false }
      - { label: "⚙️ Базис склада (EN)", name: "warehouse_en", widget: "string", default: "Tashkent, Index B2-2097", required: false }
      - { label: "⚙️ Статус наличия (RU)", name: "status", widget: "select", options: ["В наличии", "Резерв", "Под заказ"], default: "В наличии" }
      - { label: "⚙️ Ключ статуса для фильтра", name: "statusKey", widget: "select", options: ["in_stock", "reserved", "on_order"], default: "in_stock" }
      - { label: "⚙️ Фотография изделия (главная)", name: "image", widget: "image", required: false, hint: "Реальное фото узла на складе Index" }
      - label: "⚙️ Дополнительные фото товара (Галерея ракурсов)"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Фотография", name: "image", widget: "image" }
      - label: "⚙️ Документы и ссылки для скачивания"
        name: "documents"
        widget: "list"
        required: false
        fields:
          - { label: "🇷🇺 Название документа", name: "title", widget: "string" }
          - { label: "🇺🇿 Hujjat nomi (UZ)", name: "title_uz", widget: "string", required: false }
          - { label: "🇬🇧 Document title (EN)", name: "title_en", widget: "string", required: false }
          - { label: "Файл или ссылка (URL)", name: "file", widget: "file", hint: "Загрузите файл (PDF, DOCX) или вставьте внешнюю ссылку" }
          - { label: "Тип и размер (напр. PDF • 1.4 MB)", name: "type", widget: "string", required: false }
      - { label: "⚙️ Габаритные размеры (мм)", name: "dimensions", widget: "string", required: false }
      - { label: "⚙️ Масса / вес", name: "weight", widget: "string", required: false }
      - { label: "⚙️ Материал / марка стали", name: "material", widget: "string", required: false }
      - { label: "⚙️ Порядковый номер сортировки", name: "order", widget: "number", default: 1 }

      # --- ХАРАКТЕРИСТИКИ ТОВАРА (АТРИБУТЫ) ---
      - label: "⚙️ Характеристики товара (Атрибуты: Параметр -> Значение)"
        name: "attributes"
        widget: "list"
        required: false
        fields:
          - { label: "Параметр [RU]", name: "label", widget: "string" }
          - { label: "Parametr [UZ]", name: "label_uz", widget: "string", required: false }
          - { label: "Parameter [EN]", name: "label_en", widget: "string", required: false }
          - { label: "Значение [RU]", name: "value", widget: "string" }
          - { label: "Qiymat [UZ]", name: "value_uz", widget: "string", required: false }
          - { label: "Value [EN]", name: "value_en", widget: "string", required: false }

      # --- 🇷🇺 ОСНОВНОЙ ТЕКСТ (RU — ОБЯЗАТЕЛЬНЫЙ) ---
      - { label: "🇷🇺 [RU] Наименование изделия", name: "title", widget: "string", hint: "Официальное наименование по паспорту завода" }
      - { label: "🇷🇺 [RU] Подсистема (Категория)", name: "subsystem", widget: "string", required: false }
      - { label: "🇷🇺 [RU] Статус наличия (текст)", name: "status_ru", widget: "string", required: false }
      - { label: "🇷🇺 [RU] Технические параметры (specs)", name: "specs", widget: "string", hint: "Краткая инженерная характеристика для таблицы" }
      - { label: "🇷🇺 [RU] Гарантийный срок", name: "warranty", widget: "string", default: "12 месяцев с момента ввода в эксплуатацию", required: false }
      - { label: "🇷🇺 [RU] Условия ценообразования", name: "priceNote", widget: "string", default: "Цена по запросу (с НДС 12%)", required: false }
      - { label: "🇷🇺 [RU] Подробное описание и регламент (Markdown)", name: "body", widget: "markdown" }

      # --- 🇺🇿 ПЕРЕВОД НА УЗБЕКСКИЙ (UZ — O'ZBEKCHA, ОПЦИОНАЛЬНО) ---
      - { label: "🇺🇿 [UZ] Mahsulot nomi (title_uz)", name: "title_uz", widget: "string", required: false, hint: "Если оставить пустым, на сайте автоматически отобразится русская версия" }
      - { label: "🇺🇿 [UZ] Tizim (subsystem_uz)", name: "subsystem_uz", widget: "string", required: false, hint: "Agar bo'sh qolsa, ruscha ko'rinadi" }
      - { label: "🇺🇿 [UZ] Holat (status_uz)", name: "status_uz", widget: "string", required: false, hint: "Mavjud / Zaxirada / Buyurtma asosida" }
      - { label: "🇺🇿 [UZ] Texnik parametrlar (specs_uz)", name: "specs_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Kafolat (warranty_uz)", name: "warranty_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Narx izohi (priceNote_uz)", name: "priceNote_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] To'liq tavsif (body_uz - Markdown)", name: "body_uz", widget: "markdown", required: false, hint: "Agar bo'sh qolsa, ruscha asosiy matn ko'rsatiladi" }

      # --- 🇬🇧 ПЕРЕВОД НА АНГЛИЙСКИЙ (EN — ENGLISH, ОПЦИОНАЛЬНО) ---
      - { label: "🇬🇧 [EN] Product Title (title_en)", name: "title_en", widget: "string", required: false, hint: "If left blank, Russian text will be displayed automatically" }
      - { label: "🇬🇧 [EN] Subsystem (subsystem_en)", name: "subsystem_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Stock Status (status_en)", name: "status_en", widget: "string", required: false, hint: "In Stock / Reserved / On Order" }
      - { label: "🇬🇧 [EN] Technical Parameters (specs_en)", name: "specs_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Warranty (warranty_en)", name: "warranty_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Price Note (priceNote_en)", name: "priceNote_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Full Description (body_en - Markdown)", name: "body_en", widget: "markdown", required: false, hint: "If left blank, Russian body will be displayed automatically" }

  # --------------------------------------------------------------------------
  # 2. SERVICES COLLECTION
  # --------------------------------------------------------------------------
  - name: "services"
    label: "2. Каталог услуг (/services)"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "⚙️ Код услуги (напр. SRV.01)", name: "code", widget: "string" }
      - { label: "⚙️ Категория услуги", name: "category", widget: "string" }
      - { label: "⚙️ Категория (UZ)", name: "category_uz", widget: "string", required: false }
      - { label: "⚙️ Категория (EN)", name: "category_en", widget: "string", required: false }
      - { label: "⚙️ Изображение услуги", name: "image", widget: "image", required: false }
      - { label: "⚙️ Порядок отображения", name: "order", widget: "number", default: 1 }

      # --- 🇷🇺 ОСНОВНОЙ ТЕКСТ (RU) ---
      - { label: "🇷🇺 [RU] Название услуги", name: "title", widget: "string" }
      - { label: "🇷🇺 [RU] Краткий анонс / лид", name: "summary", widget: "text" }
      - { label: "🇷🇺 [RU] Текст кнопки действия (CTA)", name: "ctaLabel", widget: "string", required: false }

      # --- 🇺🇿 ПЕРЕВОД (UZ) ---
      - { label: "🇺🇿 [UZ] Xizmat nomi (title_uz)", name: "title_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Qisqa tavsif (summary_uz)", name: "summary_uz", widget: "text", required: false }
      - { label: "🇺🇿 [UZ] Tugma matni (ctaLabel_uz)", name: "ctaLabel_uz", widget: "string", required: false }

      # --- 🇬🇧 ПЕРЕВОД (EN) ---
      - { label: "🇬🇧 [EN] Service Title (title_en)", name: "title_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Summary (summary_en)", name: "summary_en", widget: "text", required: false }
      - { label: "🇬🇧 [EN] CTA Label (ctaLabel_en)", name: "ctaLabel_en", widget: "string", required: false }

      # --- ЭТАПЫ РАБОТ ---
      - label: "⚙️ Этапы выполнения работ (Шаги 1..4)"
        name: "steps"
        widget: "list"
        fields:
          - { label: "🇷🇺 Название шага", name: "title", widget: "string" }
          - { label: "🇺🇿 Qadam nomi (title_uz)", name: "title_uz", widget: "string", required: false }
          - { label: "🇬🇧 Step title (title_en)", name: "title_en", widget: "string", required: false }
          - { label: "🇷🇺 Описание шага", name: "text", widget: "text" }
          - { label: "🇺🇿 Qadam tavsifi (text_uz)", name: "text_uz", widget: "text", required: false }
          - { label: "🇬🇧 Step text (text_en)", name: "text_en", widget: "text", required: false }

      # --- ПРЕИМУЩЕСТВА И ХАРАКТЕРИСТИКИ ---
      - label: "⚙️ Преимущества и параметры услуги"
        name: "benefits"
        widget: "list"
        fields:
          - { label: "Параметр [RU]", name: "label", widget: "string" }
          - { label: "Parametr [UZ]", name: "label_uz", widget: "string", required: false }
          - { label: "Parameter [EN]", name: "label_en", widget: "string", required: false }
          - { label: "Значение [RU]", name: "value", widget: "string" }
          - { label: "Qiymat [UZ]", name: "value_uz", widget: "string", required: false }
          - { label: "Value [EN]", name: "value_en", widget: "string", required: false }

      # --- ПОДРОБНЫЙ МАТЕРИАЛ (MARKDOWN) ---
      - { label: "🇷🇺 [RU] Подробный регламент (Markdown)", name: "body", widget: "markdown" }
      - { label: "🇺🇿 [UZ] To'liq reglament (body_uz)", name: "body_uz", widget: "markdown", required: false }
      - { label: "🇬🇧 [EN] Full documentation (body_en)", name: "body_en", widget: "markdown", required: false }

  # --------------------------------------------------------------------------
  # 3. PROJECTS COLLECTION
  # --------------------------------------------------------------------------
  - name: "projects"
    label: "3. Проекты и Кейсы (/projects)"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      # --- ОБЩИЕ ТЕХНИЧЕСКИЕ ДАННЫЕ ---
      - { label: "⚙️ Код проекта (напр. LAB 01)", name: "code", widget: "string" }
      - { label: "⚙️ Изображение проекта", name: "image", widget: "image", required: false }
      - { label: "⚙️ Порядок отображения", name: "order", widget: "number", default: 1 }

      # --- 🇷🇺 ОСНОВНОЙ ТЕКСТ (RU — ОБЯЗАТЕЛЬНЫЙ) ---
      - { label: "🇷🇺 [RU] Тег проекта", name: "tag", widget: "string" }
      - { label: "🇷🇺 [RU] Название проекта", name: "title", widget: "string" }
      - { label: "🇷🇺 [RU] Подзаголовок", name: "subtitle", widget: "string" }
      - { label: "🇷🇺 [RU] Метрики проекта", name: "metrics", widget: "list" }
      - { label: "🇷🇺 [RU] Описание проекта (Markdown)", name: "body", widget: "markdown" }

      # --- 🇺🇿 ПЕРЕВОД НА УЗБЕКСКИЙ (UZ — O'ZBEKCHA, ОПЦИОНАЛЬНО) ---
      - { label: "🇺🇿 [UZ] Loyiha tegi (tag_uz)", name: "tag_uz", widget: "string", required: false, hint: "Если оставить пустым, отобразится русский текст" }
      - { label: "🇺🇿 [UZ] Loyiha nomi (title_uz)", name: "title_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Qisqa tavsif (subtitle_uz)", name: "subtitle_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Loyiha metrikalari (metrics_uz)", name: "metrics_uz", widget: "list", required: false }
      - { label: "🇺🇿 [UZ] To'liq tavsif (body_uz - Markdown)", name: "body_uz", widget: "markdown", required: false }

      # --- 🇬🇧 ПЕРЕВОД НА АНГЛИЙСКИЙ (EN — ENGLISH, ОПЦИОНАЛЬНО) ---
      - { label: "🇬🇧 [EN] Project Tag (tag_en)", name: "tag_en", widget: "string", required: false, hint: "If left blank, Russian text will be displayed" }
      - { label: "🇬🇧 [EN] Project Name (title_en)", name: "title_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Subtitle (subtitle_en)", name: "subtitle_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Project Metrics (metrics_en)", name: "metrics_en", widget: "list", required: false }
      - { label: "🇬🇧 [EN] Full Description (body_en - Markdown)", name: "body_en", widget: "markdown", required: false }

  # --------------------------------------------------------------------------
  # 4. BLOG COLLECTION
  # --------------------------------------------------------------------------
  - name: "blog"
    label: "4. Блог и Новости (/blog)"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      # --- ОБЩИЕ ТЕХНИЧЕСКИЕ ДАННЫЕ ---
      - { label: "⚙️ Дата публикации (ГГГГ-ММ-ДД)", name: "publishDate", widget: "string" }
      - { label: "⚙️ Изображение обложки", name: "image", widget: "image", required: false }
      - { label: "⚙️ Выделенная статья (Featured)", name: "featured", widget: "boolean", default: false }
      - { label: "⚙️ Автор", name: "author", widget: "string", default: "Инженерный отдел ООО «RailTech»" }

      # --- 🇷🇺 ОСНОВНОЙ ТЕКСТ (RU — ОБЯЗАТЕЛЬНЫЙ) ---
      - { label: "🇷🇺 [RU] Заголовок статьи", name: "title", widget: "string" }
      - { label: "🇷🇺 [RU] Категория", name: "category", widget: "select", options: ["Поставки и Склад", "ВЭД и Таможня", "Digital & ПО", "Спецпроекты и Арт", "Новости компании"] }
      - { label: "🇷🇺 [RU] Краткий анонс / лид", name: "summary", widget: "text" }
      - { label: "🇷🇺 [RU] Время чтения", name: "readTime", widget: "string", default: "4 мин" }
      - { label: "🇷🇺 [RU] Теги", name: "tags", widget: "list", default: [] }
      - { label: "🇷🇺 [RU] Текст статьи (Markdown)", name: "body", widget: "markdown" }

      # --- 🇺🇿 ПЕРЕВОД НА УЗБЕКСКИЙ (UZ — O'ZBEKCHA, ОПЦИОНАЛЬНО) ---
      - { label: "🇺🇿 [UZ] Maqola sarlavhasi (title_uz)", name: "title_uz", widget: "string", required: false, hint: "Если оставить пустым, отобразится русский текст" }
      - { label: "🇺🇿 [UZ] Kategoriya (category_uz)", name: "category_uz", widget: "string", required: false }
      - { label: "🇺🇿 [UZ] Qisqacha annotatsiya (summary_uz)", name: "summary_uz", widget: "text", required: false }
      - { label: "🇺🇿 [UZ] O'qish vaqti (readTime_uz)", name: "readTime_uz", widget: "string", default: "4 daq", required: false }
      - { label: "🇺🇿 [UZ] Teglar (tags_uz)", name: "tags_uz", widget: "list", required: false }
      - { label: "🇺🇿 [UZ] Maqola matni (body_uz - Markdown)", name: "body_uz", widget: "markdown", required: false }

      # --- 🇬🇧 ПЕРЕВОД НА АНГЛИЙСКИЙ (EN — ENGLISH, ОПЦИОНАЛЬНО) ---
      - { label: "🇬🇧 [EN] Article Title (title_en)", name: "title_en", widget: "string", required: false, hint: "If left blank, Russian text will be displayed" }
      - { label: "🇬🇧 [EN] Category (category_en)", name: "category_en", widget: "string", required: false }
      - { label: "🇬🇧 [EN] Article Summary / Lead (summary_en)", name: "summary_en", widget: "text", required: false }
      - { label: "🇬🇧 [EN] Reading Time (readTime_en)", name: "readTime_en", widget: "string", default: "4 min", required: false }
      - { label: "🇬🇧 [EN] Tags (tags_en)", name: "tags_en", widget: "list", required: false }
      - { label: "🇬🇧 [EN] Article Body (body_en - Markdown)", name: "body_en", widget: "markdown", required: false }

  # --------------------------------------------------------------------------
  # 5. SITE SETTINGS & STATIC PAGES
  # --------------------------------------------------------------------------
  - name: "site_settings"
    label: "5. Настройки сайта и Статические страницы"
    files:
      # --- GLOBAL SETTINGS ---
      - name: "global"
        label: "Глобальные реквизиты и контакты"
        file: "src/data/cms/global.json"
        fields:
          - { label: "⚙️ Наименование компании", name: "companyName", widget: "string" }
          - { label: "⚙️ Основной телефон", name: "phone", widget: "string" }
          - { label: "⚙️ Общий Email", name: "emailGeneral", widget: "string" }
          - { label: "⚙️ Email юротдела", name: "emailLegal", widget: "string" }
          - { label: "⚙️ Email по персональным данным", name: "emailPrivacy", widget: "string" }
          - { label: "⚙️ Ссылка на B2B портал", name: "b2bPortalUrl", widget: "string" }
          - { label: "🇷🇺 [RU] Юридический статус", name: "legalStatus", widget: "string" }
          - { label: "🇺🇿 [UZ] Yuridik maqom", name: "legalStatus_uz", widget: "string", required: false }
          - { label: "🇬🇧 [EN] Legal status", name: "legalStatus_en", widget: "string", required: false }
          - { label: "🇷🇺 [RU] ИНН / Статус резидента", name: "inn", widget: "string" }
          - { label: "🇺🇿 [UZ] STIR / Rezidentlik", name: "inn_uz", widget: "string", required: false }
          - { label: "🇬🇧 [EN] TIN / Resident status", name: "inn_en", widget: "string", required: false }
          - { label: "🇷🇺 [RU] Адрес склада и офиса", name: "address", widget: "string" }
          - { label: "🇺🇿 [UZ] Ombor va ofis manzili", name: "address_uz", widget: "string", required: false }
          - { label: "🇬🇧 [EN] Warehouse and office address", name: "address_en", widget: "string", required: false }
          - label: "⚙️ Ключевые метрики"
            name: "metrics"
            widget: "object"
            fields:
              - { label: "Лет на рынке", name: "years", widget: "string" }
              - { label: "Партнеры", name: "partners", widget: "string" }
              - { label: "Количество SKU", name: "skuCount", widget: "string" }
              - { label: "Заводы-изготовители", name: "manufacturers", widget: "string" }
              - { label: "Точность Smart Match", name: "smartMatch", widget: "string" }

      # --- HOME PAGE ---
      - name: "home"
        label: "Главная страница (/)"
        file: "src/data/cms/home.json"
        fields:
          # RU
          - { label: "🇷🇺 [RU] Бейдж Hero", name: "heroBadge", widget: "string" }
          - { label: "🇺🇿 [UZ] Hero nishoni", name: "heroBadge_uz", widget: "string", required: false }
          - { label: "🇬🇧 [EN] Hero badge", name: "heroBadge_en", widget: "string", required: false }
          - { label: "🇷🇺 [RU] Подбейдж Hero", name: "heroBadgeSub", widget: "string" }
          - { label: "🇺🇿 [UZ] Hero ost-nishoni", name: "heroBadgeSub_uz", widget: "string", required: false }
          - { label: "🇬🇧 [EN] Hero sub-badge", name: "heroBadgeSub_en", widget: "string", required: false }
