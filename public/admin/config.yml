  - name: "ui"
    label: "6. Интерфейс: кнопки и подписи"
    description: "Тексты кнопок, подписей полей, хлебных крошек и сообщений на трёх языках. Ключ (key) используется в коде — не меняйте его. Пустые UZ/EN показывают русский текст."
    folder: "src/data/cms/ui"
    format: "json"
    extension: "json"
    create: false
    delete: false
    identifier_field: "title"
    fields:
      - { label: "Раздел", name: "title", widget: "string" }
      - label: "Строки"
        name: "strings"
        widget: "list"
        collapsed: true
        summary: "{{fields.key}} — {{fields.ru}}"
        fields:
          - { label: "Ключ (не менять)", name: "key", widget: "string" }
          - { label: "🇷🇺 RU", name: "ru", widget: "text" }
          - { label: "🇺🇿 UZ", name: "uz", widget: "text", required: false }
          - { label: "🇬🇧 EN", name: "en", widget: "text", required: false }
