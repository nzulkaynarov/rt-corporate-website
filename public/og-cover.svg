    <circle cx="190" cy="190" r="120" fill="none" stroke="#0A0A0A" stroke-width="1.5"/>
    <circle cx="190" cy="190" r="60" fill="none" stroke="#0A0A0A" stroke-width="2"/>
    <circle cx="190" cy="190" r="20" fill="#0A0A0A"/>

    <!-- Isometric Bogie & Wheelset Wireframe -->
    <g stroke="#0A0A0A" stroke-width="2" fill="none">
      <!-- Rail tracks -->
      <line x1="30" y1="290" x2="350" y2="290" stroke-width="4"/>
      <line x1="30" y1="310" x2="350" y2="310" stroke-width="3"/>
      <!-- Wheelset Left -->
      <ellipse cx="90" cy="230" rx="36" ry="60" stroke-width="2.5"/>
      <ellipse cx="90" cy="230" rx="14" ry="24" stroke-width="1.5"/>
      <!-- Wheelset Right -->
      <ellipse cx="290" cy="230" rx="36" ry="60" stroke-width="2.5"/>
      <ellipse cx="290" cy="230" rx="14" ry="24" stroke-width="1.5"/>
      <!-- Axle connection -->
      <line x1="90" y1="230" x2="290" y2="230" stroke-width="5"/>
      <!-- Side frame 18-100 -->
      <polygon points="60,190 320,190 300,160 80,160" stroke-width="2.5" fill="#D4D8DC" fill-opacity="0.8"/>
      <!-- Bolster Center -->
      <rect x="150" y="130" width="80" height="40" stroke-width="2.5" fill="#0A0A0A"/>
      <!-- Spring group -->
      <line x1="165" y1="170" x2="165" y2="190" stroke-width="3"/>
      <line x1="180" y1="170" x2="180" y2="190" stroke-width="3"/>
      <line x1="200" y1="170" x2="200" y2="190" stroke-width="3"/>
      <line x1="215" y1="170" x2="215" y2="190" stroke-width="3"/>
    </g>

    <text x="190" y="355" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0A0A0A" letter-spacing="1">
