      <text x="164" y="20" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4A5056">ЗАВОДЫ-ИЗГОТ.</text>
      <text x="164" y="42" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#0A0A0A">86+ ПАРТН.</text>

      <!-- Badge 3 -->
