<!DOCTYPE html>
<html lang="{{ .Lang }}" dir="{{ default "ltr" .Language.LanguageDirection }}" data-search-placeholder="{{ i18n "search_placeholder_full" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="site-body">
  {{- partial "svg-sprite.html" . -}}
  {{- partial "header.html" . -}}
  <main id="main-content">
    {{- block "main" . }}{{ end -}}
  </main>
  {{- partial "footer.html" . -}}
  {{- partial "scripts.html" . -}}
</body>
</html>
