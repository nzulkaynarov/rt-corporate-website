{{/* Organization Schema */}}
{{ if .IsHome }}
{{ $company := .Site.Data.company }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ $company.brandName }}",
  "legalName": "{{ $company.legalName }}",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.Params.ogImage | absURL }}",
  "foundingDate": "{{ $company.foundingYear }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ $company.address.city }}",
    "addressCountry": "{{ $company.address.country }}",
    "streetAddress": "{{ $company.address.street }}"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "{{ .Site.Params.phone }}",
    "email": "{{ .Site.Params.email }}",
    "contactType": "customer service",
    "availableLanguage": ["Russian", "English", "Uzbek"]
  },
  "sameAs": [
    {{ with .Site.Params.social.telegram }}"{{ . }}"{{ end }}
    {{ with .Site.Params.social.linkedin }},"{{ . }}"{{ end }}
    {{ with .Site.Params.social.facebook }},"{{ . }}"{{ end }}
  ]
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}"
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{ $company.brandName }}",
  "image": "{{ .Site.Params.ogImage | absURL }}",
  "telephone": "{{ .Site.Params.phone }}",
  "email": "{{ .Site.Params.email }}",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ $company.address.city }}",
    "addressCountry": "{{ $company.address.country }}"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": {{ .Site.Params.mapLat }},
    "longitude": {{ .Site.Params.mapLon }}
  },
  "openingHours": "{{ $company.businessHours }}"
}
</script>
{{ end }}

{{/* BreadcrumbList Schema */}}
{{ if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "{{ .Site.Title }}",
      "item": "{{ .Site.BaseURL }}"
    }
    {{ if .Parent }}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Parent.Title }}",
      "item": "{{ .Parent.Permalink }}"
    }
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
    {{ else }}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": "{{ .Title }}",
      "item": "{{ .Permalink }}"
    }
    {{ end }}
  ]
}
</script>
{{ end }}

{{/* Article Schema for blog posts */}}
{{ if and .IsPage (eq .Section "blog") }}
{{ $company := .Site.Data.company }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ .Description }}",
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  {{ with .Params.author }}"author": { "@type": "Person", "name": "{{ . }}" },{{ end }}
  "publisher": {
    "@type": "Organization",
    "name": "{{ $company.brandName }}",
    "logo": { "@type": "ImageObject", "url": "{{ .Site.Params.ogImage | absURL }}" }
  },
  "mainEntityOfPage": "{{ .Permalink }}"
}
</script>
{{ end }}
