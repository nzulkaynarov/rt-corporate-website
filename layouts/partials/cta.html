<section class="cta-section" aria-label="Call to action">
  <div class="container center">
    <h2 class="cta-title">{{ i18n "cta_title" }}</h2>
    <p class="cta-desc">{{ i18n "cta_desc" }}</p>
    <div class="cta-actions">
      <a href="{{ relLangURL "contact" }}/" class="btn btn-primary btn-lg">{{ i18n "cta_primary" }}</a>
      <a href="{{ .Site.Params.catalogURL }}" class="btn btn-outline btn-lg" target="_blank" rel="noopener">{{ i18n "cta_secondary" }} →</a>
    </div>
  </div>
</section>
