<section class="section partners-section" aria-label="{{ i18n "partners_title" }}">
  <div class="container">
    <div class="section-header center">
      <h2 class="section-title">{{ i18n "partners_title" }}</h2>
      <p class="section-desc">{{ i18n "partners_desc" }}</p>
    </div>
    <div class="partners-container">
      <div class="partners-grid">
        {{ range .Site.Data.company.partners }}
        <div class="partner-card">
          <div class="partner-logo-box">
            {{ with .logo }}
            <img src="{{ . }}" alt="{{ $.name }}" loading="lazy" width="120" height="40">
            {{ else }}
            <span>{{ .name }}</span>
            {{ end }}
          </div>
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
