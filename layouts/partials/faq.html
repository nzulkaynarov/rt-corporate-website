<section class="section section-alt" id="faq" aria-label="FAQ">
  <div class="container container-narrow">
    <div class="section-header center">
      <h2 class="section-title">{{ i18n "faq_title" }}</h2>
      <p class="section-desc">{{ i18n "faq_desc" }}</p>
    </div>
    <div class="faq-list" itemscope itemtype="https://schema.org/FAQPage">
      {{/* Support both flat .Params.faq and nested .Params.faq.items */}}
      {{ $items := .Params.faq }}
      {{ if reflect.IsMap $items }}
        {{ $items = $items.items }}
      {{ end }}
      {{ range $items }}
      <details class="faq-item" itemscope itemprop="mainEntity" itemtype="https://schema.org/Question">
        <summary class="faq-question" itemprop="name">
          {{ .question }}
          <svg class="faq-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="faq-answer" itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer">
          <p itemprop="text">{{ .answer }}</p>
        </div>
      </details>
      {{ end }}
    </div>
  </div>
</section>
