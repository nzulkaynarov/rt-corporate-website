<section class="section advantages-section" aria-label="{{ i18n "adv_1_title" }}">
  <div class="container">
    <div class="advantages-grid">
      {{ range .Site.Data.advantages.items }}
      <div class="advantage-card card card-glass">
        <div class="advantage-icon icon-accent">
          {{ .icon | safeHTML }}
        </div>
        <h3>{{ i18n .titleKey }}</h3>
        <p>{{ i18n .descKey }}</p>
      </div>
      {{ end }}
    </div>
  </div>
</section>
