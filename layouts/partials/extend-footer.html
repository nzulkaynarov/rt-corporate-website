{{/* RailTech — extra footer content (ecosystem links + copyright) */}}
{{ $extra := .Site.Params.extra }}

<div class="mt-8 border-t border-neutral-800 pt-6 text-center text-sm text-neutral-500">

  {{/* Ecosystem links */}}
  <div class="mb-4">
    <span class="font-semibold text-neutral-400">{{ i18n "footer_eco" }}:</span>
    <a href="{{ $extra.catalogURL }}" target="_blank" rel="noopener noreferrer"
       class="ml-2 text-primary-400 hover:text-primary-300 transition-colors">
      {{ i18n "footer_cat" }}
    </a>
    <span class="mx-1">·</span>
    <a href="{{ $extra.cabinetURL }}" target="_blank" rel="noopener noreferrer"
       class="text-primary-400 hover:text-primary-300 transition-colors">
      {{ i18n "footer_cab" }}
    </a>
  </div>

  {{/* Copyright */}}
  <p>{{ i18n "footer_copy" }}</p>
</div>
