name: PR checks (content & build)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Content rules (translations, glossary, media paths, placeholders) — docs/content/README.md
      - name: Check content
        run: npm run check:content

      # CMS schema (prebuild) + astro check + build + SEO/i18n audit of dist/ (postbuild)
      - name: Build site
        run: npm run build
