name: PR checks (make ci)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CMS schema, content rules (translation stage is read from src/data/content-stage.json),
      # unit + data-contract tests, astro check, build and the audit of dist/
      - name: make check
        run: make check

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Browser tests of the built site on desktop and phone (CRM is mocked)
      - name: Browser tests
        run: npx playwright test
        env:
          PW_CHROMIUM_PATH: ""
