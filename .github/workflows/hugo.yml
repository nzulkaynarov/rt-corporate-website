# Build Hugo in private repo → deploy to public repo for GitHub Pages
# Source: nzulkaynarov/rt-corporate-website (private)
# Target: nzulkaynarov/rt-website-public (public, GitHub Pages)

name: Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.145.0
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('**/hugo.toml') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tashkent
        run: |
          # Use custom domain if CNAME is set, otherwise fall back to GitHub Pages URL
          SITE_URL="${{ vars.SITE_URL || 'https://nzulkaynarov.github.io/rt-website-public/' }}"
          hugo \
            --gc \
            --minify \
            --baseURL "$SITE_URL"

      - name: Deploy to public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: nzulkaynarov/rt-website-public
          publish_branch: main
          publish_dir: ./public
