# Build Hugo in private repo → deploy to public repo for GitHub Pages
# Source: nzulkaynarov/rt-corporate-website (private)
# Target: configured via DEPLOY_REPO variable (public, GitHub Pages)
#
# Required GitHub Variables (Settings → Variables → Actions):
#   SITE_URL       — Site base URL (e.g. https://locodep.uz/ or https://user.github.io/repo/)
#   DEPLOY_REPO    — Target repo for deployment (e.g. nzulkaynarov/rt-website-public)
#
# Optional GitHub Variables:
#   CNAME_DOMAIN   — Custom domain for CNAME file (e.g. locodep.uz). Leave empty for *.github.io
#
# Required GitHub Secrets:
#   DEPLOY_KEY     — SSH private key with write access to DEPLOY_REPO
#
# Setup required on target repo:
#   1. Settings → Pages → Source → "Deploy from a branch"
#   2. Branch: gh-pages / root
#   3. Deploy key with write access (public part of DEPLOY_KEY)

name: Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.1
    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ hashFiles('**/hugo.toml') }}
          restore-keys: hugo-${{ runner.os }}-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tashkent
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ vars.SITE_URL }}"
          touch public/.nojekyll
          # Create CNAME file if custom domain is set
          if [ -n "${{ vars.CNAME_DOMAIN }}" ]; then
            echo "${{ vars.CNAME_DOMAIN }}" > public/CNAME
          fi

      - name: Deploy to public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ vars.DEPLOY_REPO }}
          publish_branch: gh-pages
          publish_dir: ./public
