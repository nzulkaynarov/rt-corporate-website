# Build Hugo in private repo → deploy to public repo for GitHub Pages
# Source: nzulkaynarov/rt-corporate-website (private)
# Target: configured via DEPLOY_REPO variable (public, GitHub Pages)
#
# Required GitHub Variables (Settings → Variables → Actions):
#   DEPLOY_REPO    — Target repo (e.g. nzulkaynarov/rt-website-public)
#
# Optional GitHub Variables:
#   SITE_URL       — Override baseURL from hugo.toml (e.g. https://railtech.uz/)
#   CNAME_DOMAIN   — Custom domain for CNAME file (e.g. railtech.uz). Leave empty for *.github.io
#
# Required GitHub Secrets:
#   DEPLOY_KEY     — SSH private key with write access to DEPLOY_REPO
#
# Setup required on target repo:
#   1. Settings → Pages → Source → "Deploy from a branch"
#   2. Branch: gh-pages / root
#   3. Deploy key with write access (public part of DEPLOY_KEY)

name: Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.159.0

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required variables
        run: |
          if [ -z "${{ vars.DEPLOY_REPO }}" ]; then
            echo "::error::DEPLOY_REPO variable is not set. Go to Settings → Variables → Actions and add it."
            exit 1
          fi

      - name: Checkout source (private repo)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo ${{ env.HUGO_VERSION }} extended
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Cache Hugo build
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ hashFiles('hugo.toml', '.gitmodules') }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-
            hugo-${{ runner.os }}-

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tashkent
        run: |
          # Use SITE_URL override if set, otherwise fall back to baseURL in hugo.toml
          EXTRA_ARGS=""
          if [ -n "${{ vars.SITE_URL }}" ]; then
            EXTRA_ARGS="--baseURL ${{ vars.SITE_URL }}"
            echo "Using baseURL override: ${{ vars.SITE_URL }}"
          else
            echo "Using baseURL from hugo.toml"
          fi

          hugo \
            --gc \
            --minify \
            $EXTRA_ARGS

          # Validate build output
          if [ ! -f public/index.html ]; then
            echo "::error::Build failed — public/index.html not found"
            exit 1
          fi

          PAGE_COUNT=$(find public -name '*.html' | wc -l)
          echo "Built $PAGE_COUNT HTML pages"

          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "::error::Suspiciously low page count ($PAGE_COUNT). Expected 50+. Aborting deploy."
            exit 1
          fi

          touch public/.nojekyll
          if [ -n "${{ vars.CNAME_DOMAIN }}" ]; then
            echo "${{ vars.CNAME_DOMAIN }}" > public/CNAME
          fi

      - name: Deploy to public repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ vars.DEPLOY_REPO }}
          publish_branch: gh-pages
          publish_dir: ./public
