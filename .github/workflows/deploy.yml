name: Deploy RailTech Portal to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      # Social preview (public/og-cover.png) is redrawn from the CMS data (title, services, contacts), so an edit in
      # /admin also updates the picture in messengers. The script draws text with system fonts → Montserrat from apt.
      # If this step fails, the site is published with the committed picture.
      - name: Social preview from CMS data
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-montserrat
          npm run og

      - name: Build static site with Astro (includes CMS schema check and dist audit)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
