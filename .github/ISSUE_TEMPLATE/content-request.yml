name: Новый контент для сайта
description: Бриф для ИИ-агента или редактора — новость, статья, проект, партнёр, услуга или правка текстов (RU, UZ, EN; новости только RU).
title: "[content] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        Заполните бриф. Агент подготовит материал на русском, узбекском и английском (новости пока **только на русском**)
        по правилам `docs/content/` и откроет PR на проверку.
        **Всё, что не указано здесь, агент не будет выдумывать:** цены, клиентов, сертификаты, цифры, статусы.
        Каталога и цен на сайте нет, они ведутся в Кабинете. В общих текстах отрасль не упоминается.
  - type: dropdown
    id: type
    attributes:
      label: Тип контента
      options:
        - Новость
        - Статья
        - Проект / кейс
        - Партнёр (плитка и статья о партнёре)
        - Услуга (одна из четырёх)
        - Правка текстов страниц / SEO / подписей
        - Перевод UZ/EN (новости — только по решению владельца)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что публикуем
      description: Тема, событие, производитель или какую страницу правим.
    validations:
      required: true
  - type: textarea
    id: facts
    attributes:
      label: Факты
      description: Дата и место, участники и должности, роль RailTech, цифры проекта, клиент (с разрешением на упоминание). Для партнёра — статус (официальный дилер только при документе производителя; номер документа на сайте не публикуется) или прямые поставки.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Источники
      description: Официальные сайты, публикации организаторов, документы. Можно приложить файлы.
  - type: textarea
    id: media
    attributes:
      label: Фото
      description: Свои фото или фото с разрешения (JPG, ≥ 1200 px по ширине). Без фото материал выйдет с плашкой «Фото готовится».
  - type: textarea
    id: notes
    attributes:
      label: Особые указания
      description: Срок публикации, на что сделать акцент, что не упоминать.
